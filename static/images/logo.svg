<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MetaboNet CGM logo: a blood-glucose drop with a CGM trace inside the diabetes awareness circle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8204b"/>
      <stop offset="1" stop-color="#4a0d22"/>
    </linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbe3ea"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- the diabetes awareness circle -->
  <circle cx="32" cy="33" r="23.5" fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="3"/>
  <!-- blood glucose drop -->
  <path d="M32 9.5c0 0-14.5 17.2-14.5 27.3a14.5 14.5 0 0 0 29 0C46.5 26.7 32 9.5 32 9.5z" fill="url(#d)"/>
  <!-- CGM trace -->
  <polyline points="20.5,38 25.5,38 28.6,30.5 32.4,45 35.6,34.2 38.4,38 43.5,38"
            fill="none" stroke="#8e1f45" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
